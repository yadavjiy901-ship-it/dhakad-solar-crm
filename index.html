<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Dhakad Agro Solar Solution</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef1f5;
padding:18px;
color:#111827;
overflow-x:hidden;
}

.hidden{
display:none !important;
}

/* LOGIN */

#loginPage{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#e2e8f0;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
z-index:9999;
}

.login-card{
background:white;
padding:40px;
border-radius:34px;
width:100%;
box-shadow:0 10px 30px rgba(0,0,0,0.12);
}

.login-card h2{
text-align:center;
margin-bottom:24px;
font-size:34px;
}

input{
width:100%;
padding:22px;
border-radius:22px;
border:1px solid #d1d5db;
font-size:20px;
margin-bottom:22px;
outline:none;
}

.btn{
width:100%;
padding:22px;
border:none;
border-radius:24px;
font-size:22px;
font-weight:700;
color:white;
cursor:pointer;
text-align:center;
}

.primary{
background:#2563eb;
}

.success{
background:#16a34a;
}

header{
background:linear-gradient(135deg,#16a34a,#059669);
padding:42px 24px;
border-radius:36px;
color:white;
text-align:center;
margin-bottom:24px;
}

header h1{
font-size:42px;
line-height:1.3;
}

header p{
font-size:20px;
margin-top:12px;
}

.dc-box{
background:white;
padding:35px;
border-radius:30px;
margin-bottom:20px;
box-shadow:0 8px 24px rgba(0,0,0,0.08);
cursor:pointer;
}

.dc-title{
font-size:28px;
font-weight:700;
margin-bottom:10px;
}

.dc-sub{
font-size:18px;
opacity:0.7;
}

.customer-card{
background:white;
padding:30px;
border-radius:30px;
margin-bottom:22px;
box-shadow:0 8px 24px rgba(0,0,0,0.08);
}

.customer-card h3{
font-size:28px;
margin-bottom:20px;
}

.info{
font-size:19px;
margin-bottom:12px;
word-break:break-word;
}

.buttons{
display:grid;
gap:15px;
margin-top:20px;
}

.note-box{
background:#fef9c3;
padding:20px;
border-radius:20px;
margin-top:20px;
font-size:17px;
line-height:1.8;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

<div class="login-card">

<h2>
🔐 Secure Login
</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button
class="btn primary"
onclick="login()">

Login

</button>

<p
id="loginError"
style="
color:red;
margin-top:15px;
text-align:center;
font-size:18px;
"></p>

</div>

</div>

<!-- MAIN -->

<div id="mainWebsite">

<header>

<h1>
☀️ Dhakad Agro<br>
Solar Solution
</h1>

<p>
Solar Lead Management System
</p>

</header>

<!-- DC -->

<div
class="dc-box"
onclick="openDC('dhamna')">

<div class="dc-title">
🏡 DHAMNAR DC
</div>

<div class="dc-sub">
Tap to Open Customer Data
</div>

</div>

<div
class="dc-box"
onclick="openDC('afjalpur')">

<div class="dc-title">
🏘️ AFJALPUR DC
</div>

<div class="dc-sub">
Tap to Open Customer Data
</div>

</div>

<!-- FILE -->

<div class="dc-box">

<input
type="file"
id="excelFile"
accept=".xlsx,.xls">

<button
class="btn success"
onclick="loadExcel()">

📂 Upload Excel

</button>

</div>

<!-- CUSTOMER LIST -->

<div id="customerList"></div>

</div>

<script>

let customerData=[];

/* LOGIN */

function login(){

const user =
document.getElementById(
'username'
).value.trim();

const pass =
document.getElementById(
'password'
).value.trim();

if(
user==="574944771302"
&&
pass==="9754353316"
){

localStorage.setItem(
'loginSuccess',
'yes'
);

document.getElementById(
'loginPage'
).classList.add(
'hidden'
);

}else{

document.getElementById(
'loginError'
).innerText =
'❌ Wrong Username or Password';

}

}

/* AUTO LOGIN */

window.onload=function(){

if(
localStorage.getItem(
'loginSuccess'
)==='yes'
){

document.getElementById(
'loginPage'
).classList.add(
'hidden'
);

}

};

/* OPEN DC */

function openDC(name){

alert(
name.toUpperCase()+
' Opened'
);

}

/* EXCEL */

function loadExcel(){

const file =
document.getElementById(
'excelFile'
).files[0];

if(!file){

alert(
'Select Excel File'
);

return;

}

const reader =
new FileReader();

reader.onload =
function(e){

const data =
new Uint8Array(
e.target.result
);

const workbook =
XLSX.read(
data,
{
type:'array'
}
);

const sheetName =
workbook.SheetNames[0];

const worksheet =
workbook.Sheets[sheetName];

customerData =
XLSX.utils.sheet_to_json(
worksheet
);

renderCustomers();

};

reader.readAsArrayBuffer(file);

}

/* RENDER */

function renderCustomers(){

const list =
document.getElementById(
'customerList'
);

list.innerHTML='';

customerData.forEach(customer=>{

const name =
customer['Consumer Name Hindi']
||
'No Name';

const mobile =
customer['Mobile Number']
||
'';

const consumer =
customer['Consumer Number']
||
'';

const address =
customer['Address Hindi']
||
'';

const purpose =
customer['Purpose']
||
'';

const load =
customer['Sanctioned Load']
||
'';

const units =
customer['Total Unit']
||
'';

const bill =
customer['Net Bill']
||
'';

list.innerHTML += `

<div class="customer-card">

<h3>
👤 ${name}
</h3>

<div class="info">
📱 Mobile: ${mobile}
</div>

<div class="info">
🔢 Consumer No: ${consumer}
</div>

<div class="info">
🏠 Address: ${address}
</div>

<div class="info">
⚡ Purpose: ${purpose}
</div>

<div class="info">
🔌 Sanctioned Load: ${load}
</div>

<div class="info">
📊 Total Unit: ${units}
</div>

<div class="info">
💰 Net Bill: ₹${bill}
</div>

<div class="buttons">

<a
href="tel:${mobile}"
class="btn success"
style="text-decoration:none;">

📞 Call

</a>

</div>

<div class="note-box">

<b>
📄 Required Documents:
</b>

<br><br>

• Aadhaar Card<br>
• PAN Card<br>
• Bank Passbook<br>
• SBI Bank Account

</div>

</div>

`;

});

}

</script>

</body>
</html>
