<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Yadav Data Management</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

html{
width:100%;
min-height:100%;
overflow-x:hidden;
background:#eef1f5;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
padding:18px;
background:#eef1f5;
overflow-x:hidden;
color:#111827;
}

header{
background:linear-gradient(135deg,#16a34a,#059669);
padding:42px 24px;
border-radius:36px;
color:white;
text-align:center;
margin-bottom:24px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

header h1{
font-size:50px;
font-weight:300;
line-height:1.15;
margin-bottom:18px;
}

header p{
font-size:22px;
opacity:0.95;
padding-top:18px;
border-top:1px solid rgba(255,255,255,0.4);
}

.dc-container{
display:grid;
grid-template-columns:1fr;
gap:24px;
margin-bottom:24px;
}

.dc-box{
background:white;
padding:42px 30px;
border-radius:34px;
box-shadow:0 8px 24px rgba(0,0,0,0.08);
cursor:pointer;
}

.dc-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.dc-title{
font-size:30px;
font-weight:600;
}

.dc-sub{
font-size:18px;
opacity:0.7;
}

.card-box{
background:white;
padding:34px;
border-radius:34px;
box-shadow:0 8px 24px rgba(0,0,0,0.08);
margin-bottom:24px;
}

.card-box h2{
font-size:28px;
margin-bottom:24px;
}

label{
font-size:20px;
display:block;
margin-bottom:12px;
}

input,
select{
width:100%;
padding:22px;
border-radius:22px;
border:1px solid #d1d5db;
font-size:20px;
margin-bottom:22px;
background:white;
outline:none;
}

.btn{
width:100%;
padding:22px;
border:none;
border-radius:24px;
font-size:22px;
font-weight:700;
color:white;
margin-top:10px;
text-decoration:none;
display:block;
text-align:center;
cursor:pointer;
}

.success{
background:#16a34a;
}

.danger{
background:#dc2626;
}

.primary{
background:#2563eb;
}

.warning{
background:#f59e0b;
}

.dark{
background:#111827;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-bottom:24px;
}

.stat-box{
background:white;
padding:28px;
border-radius:28px;
text-align:center;
font-size:20px;
font-weight:700;
box-shadow:0 8px 24px rgba(0,0,0,0.08);
}

.customer-card{
background:white;
padding:30px;
border-radius:32px;
margin-bottom:24px;
box-shadow:0 8px 24px rgba(0,0,0,0.08);
}

.customer-card h3{
font-size:30px;
margin-bottom:18px;
}

.info{
font-size:20px;
margin-bottom:12px;
word-break:break-word;
}

.buttons{
display:grid;
gap:18px;
margin-top:24px;
}

.note-box{
background:#fef9c3;
padding:24px;
border-radius:24px;
margin-top:24px;
font-size:18px;
line-height:1.8;
}

#loginPage{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#e2e8f0;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
z-index:999;
}

.login-card{
background:white;
padding:40px;
border-radius:34px;
width:100%;
box-shadow:0 10px 30px rgba(0,0,0,0.12);
}

.login-card h2{
text-align:center;
margin-bottom:24px;
font-size:34px;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div id="loginPage">

<div class="login-card">

<h2>🔐 Secure Login</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button
onclick="login()"
class="btn primary">

Login

</button>

<p
id="loginError"
style="
color:red;
margin-top:18px;
text-align:center;
font-size:18px;
"></p>

</div>

</div>

<header>

<h1>
☀️ Dhakad Agro<br>
Solar Solution
</h1>

<p>
Solar Lead Management System
</p>

</header>

<div id="homePage">

<div class="dc-container">

<div class="dc-box"
onclick="openDC('dhamna')">

<div class="dc-top">

<div
id="dhamnaTitle"
class="dc-title">

🏡 DHAMNAR DC

</div>

</div>

<div class="dc-sub">
Tap to Open Customer Data
</div>

</div>

<div class="dc-box"
onclick="openDC('afjalpur')">

<div class="dc-top">

<div
id="afjalpurTitle"
class="dc-title">

🏘️ AFJALPUR DC

</div>

</div>

<div class="dc-sub">
Tap to Open Customer Data
</div>

</div>

</div>

<div class="card-box">

<h2>
📂 Upload Excel Data
</h2>

<label>Dhamnar DC File</label>

<input
type="file"
id="dhamnaFile"
accept=".xlsx,.xls">

<label>Afjalpur DC File</label>

<input
type="file"
id="afjalpurFile"
accept=".xlsx,.xls">

<button
class="btn success"
onclick="loadFiles()">

🚀 Load Customer Data

</button>

</div>

</div>

<div id="dcPage"
class="hidden">

<a
onclick="goHome()"
class="btn dark">

⬅ Back

</a>

<br><br>

<input
type="text"
id="searchBox"
placeholder="🔍 Search Customer"
onkeyup="renderCustomers()">

<div class="stats">

<div class="stat-box">

👥 Total

<br><br>

<span id="totalCount">0</span>

</div>

<div class="stat-box"
style="background:#dcfce7;">

✅ Interested

<br><br>

<span id="interestedCount">0</span>

</div>

</div>

<div id="customerList"></div>

</div>

<script>

function login(){

const user =
document.getElementById(
'username'
).value.trim();

const pass =
document.getElementById(
'password'
).value.trim();

if(
user==="574944771302"
&&
pass==="9754353316"
){

document.getElementById(
'loginPage'
).style.display="none";

localStorage.setItem(
'loginSuccess',
'yes'
);

}else{

document.getElementById(
'loginError'
).innerText =
'❌ Wrong Username or Password';

}

}

if(
localStorage.getItem(
'loginSuccess'
)==='yes'
){

document.getElementById(
'loginPage'
).style.display='none';

}

let dhamnaData=[];
let afjalpurData=[];
let currentDC='';

function loadFiles(){

const dhamnaFile =
document.getElementById(
'dhamnaFile'
).files[0];

const afjalpurFile =
document.getElementById(
'afjalpurFile'
).files[0];

if(dhamnaFile){
readExcel(
dhamnaFile,
'dhamna'
);
}

if(afjalpurFile){
readExcel(
afjalpurFile,
'afjalpur'
);
}

}

function readExcel(
file,
type
){

const reader =
new FileReader();

reader.onload =
function(e){

const data =
new Uint8Array(
e.target.result
);

const workbook =
XLSX.read(
data,
{
type:'array'
}
);

const sheetName =
workbook.SheetNames[0];

const worksheet =
workbook.Sheets[sheetName];

const json =
XLSX.utils.sheet_to_json(
worksheet
);

if(type==='dhamna'){
dhamnaData=json;
}else{
afjalpurData=json;
}

};

reader.readAsArrayBuffer(file);

}

function openDC(dc){

currentDC=dc;

document.getElementById(
'homePage'
).classList.add(
'hidden'
);

document.getElementById(
'dcPage'
).classList.remove(
'hidden'
);

renderCustomers();

}

function goHome(){

document.getElementById(
'homePage'
).classList.remove(
'hidden'
);

document.getElementById(
'dcPage'
).classList.add(
'hidden'
);

}

function renderCustomers(){

const list =
document.getElementById(
'customerList'
);

list.innerHTML='';

let data =
currentDC==='dhamna'
? dhamnaData
: afjalpurData;

document.getElementById(
'totalCount'
).innerText =
data.length;

data.forEach(customer=>{

const name =
customer['Consumer Name Hindi']
||
'No Name';

const mobile =
customer['Mobile Number']
||
'';

const consumer =
customer['Consumer Number']
||
'';

const address =
customer['Address Hindi']
||
'';

const purpose =
customer['Purpose']
||
'';

const load =
customer['Sanctioned Load']
||
'';

const units =
customer['Total Unit']
||
'';

const bill =
customer['Net Bill']
||
'';

list.innerHTML += `

<div class="customer-card">

<h3>
👤 ${name}
</h3>

<div class="info">
📱 Mobile: ${mobile}
</div>

<div class="info">
🔢 Consumer No: ${consumer}
</div>

<div class="info">
🏠 Address: ${address}
</div>

<div class="info">
⚡ Purpose: ${purpose}
</div>

<div class="info">
🔌 Sanctioned Load: ${load}
</div>

<div class="info">
📊 Total Unit: ${units}
</div>

<div class="info">
💰 Net Bill: ₹${bill}
</div>

<div class="buttons">

<a
href="tel:${mobile}"
class="btn success">

📞 Call

</a>

<a
href="https://wa.me/91${mobile}"
target="_blank"
class="btn primary">

💬 WhatsApp

</a>

</div>

</div>

`;

});

}

</script>

</body>
</html>
